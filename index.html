<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ものおき日記</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>ものおき日記</h1>
      <p class="site-intro">ゴミの音ゲーマーのものおき、兼、日記。X:@m4fua</p>
    </header>

    <div class="layout-grid">
      <main class="main-col">
        <div id="tag-bar" class="tag-bar"></div>
        <ul id="doc-list" class="doc-list"></ul>
      </main>

      <aside id="archive-sidebar" class="sidebar-col" aria-label="投稿時期アーカイブ"></aside>
    </div>
  </div>

  <script src="docs.js"></script>
  <script>
    const listEl = document.getElementById("doc-list");
    const tagBarEl = document.getElementById("tag-bar");
    const archiveEl = document.getElementById("archive-sidebar");

    // docs.js の下にある（新しい）データほど上に表示されるよう逆順にする
    const items = Array.isArray(DOCUMENTS) ? [...DOCUMENTS].reverse() : [];
    let selectedTag = "ALL";
    let selectedMonth = "ALL";

    // 日付文字列 ("2026-11-27" や "2026/11/27" 等) から "YYYY-MM" を抽出
    function extractYearMonth(dateStr) {
      if (typeof dateStr !== "string") return null;
      const m = dateStr.trim().match(/^(\d{4})[-/](\d{1,2})/);
      if (!m) return null;
      return `${m[1]}-${m[2].padStart(2, "0")}`;
    }

    // "2026-11" -> "2026年11月"
    function formatYearMonthLabel(ym) {
      const [y, m] = ym.split("-");
      return `${y}年${parseInt(m, 10)}月`;
    }

    // 全アイテムから重複なしでタグ一覧を抽出
    const allTags = Array.from(
      new Set(items.flatMap((doc) => (Array.isArray(doc.tags) ? doc.tags : [])))
    );

    // 投稿時期ごとの件数を集計（新しい年月順）
    const monthCountMap = new Map();
    items.forEach((doc) => {
      const ym = extractYearMonth(doc.date);
      if (ym) {
        monthCountMap.set(ym, (monthCountMap.get(ym) || 0) + 1);
      }
    });
    const allMonths = Array.from(monthCountMap.keys()).sort((a, b) =>
      b.localeCompare(a)
    );

    function renderTagBar() {
      if (allTags.length === 0) {
        tagBarEl.innerHTML = "";
        return;
      }

      const tagsToShow = ["ALL", ...allTags];
      tagBarEl.innerHTML = tagsToShow
        .map((tag) => {
          const label = tag === "ALL" ? "すべて" : tag;
          const activeClass = selectedTag === tag ? "active" : "";
          return `<button type="button" class="tag-filter-btn ${activeClass}" data-tag="${tag}">${label}</button>`;
        })
        .join("");

      tagBarEl.querySelectorAll(".tag-filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedTag = btn.dataset.tag;
          renderTagBar();
          renderList();
        });
      });
    }

    function renderArchiveSidebar() {
      if (allMonths.length === 0) {
        archiveEl.innerHTML = "";
        return;
      }

      const monthItemsHtml = [
        `<li>
          <button type="button" class="archive-btn ${selectedMonth === "ALL" ? "active" : ""}" data-month="ALL">
            <span>すべての時期</span>
            <span class="archive-count">${items.length}</span>
          </button>
        </li>`,
        ...allMonths.map((ym) => {
          const activeClass = selectedMonth === ym ? "active" : "";
          return `<li>
            <button type="button" class="archive-btn ${activeClass}" data-month="${ym}">
              <span>${formatYearMonthLabel(ym)}</span>
              <span class="archive-count">${monthCountMap.get(ym)}</span>
            </button>
          </li>`;
        }),
      ].join("");

      archiveEl.innerHTML = `
        <div class="archive-box">
          <div class="archive-heading">アーカイブ</div>
          <ul class="archive-list">${monthItemsHtml}</ul>
        </div>
      `;

      archiveEl.querySelectorAll(".archive-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedMonth = btn.dataset.month;
          renderArchiveSidebar();
          renderList();
        });
      });
    }

    function renderList() {
      const filtered = items.filter((doc) => {
        const matchTag =
          selectedTag === "ALL" ||
          (Array.isArray(doc.tags) && doc.tags.includes(selectedTag));
        const matchMonth =
          selectedMonth === "ALL" ||
          extractYearMonth(doc.date) === selectedMonth;
        return matchTag && matchMonth;
      });

      if (filtered.length === 0) {
        listEl.innerHTML =
          '<li class="empty">公開中のコンテンツはまだありません。</li>';
        return;
      }

      listEl.innerHTML = "";
      filtered.forEach((doc) => {
        const li = document.createElement("li");
        li.className = "doc-item";

        const tagsHtml =
          Array.isArray(doc.tags) && doc.tags.length > 0
            ? `<div class="doc-tags">${doc.tags
                .map((t) => `<span class="doc-tag">${t}</span>`)
                .join("")}</div>`
            : "";

        const hasUrl = typeof doc.url === "string" && doc.url.trim() !== "";
        const hasContent =
          typeof doc.content === "string" && doc.content.trim() !== "";

        if (hasUrl) {
          // 外部リンク項目
          li.innerHTML = `
            <a class="doc-link" href="${doc.url}" target="_blank" rel="noopener noreferrer">
              <div class="doc-head">
                ${doc.date ? `<span class="doc-date">${doc.date}</span>` : ""}
                ${doc.title ? `<span class="doc-title">${doc.title}</span>` : ""}
              </div>
              ${doc.description ? `<p class="doc-desc">${doc.description}</p>` : ""}
              ${tagsHtml}
            </a>
          `;
        } else if (doc.accordion) {
          // アコーディオン形式（クリックで本文を開閉）
          const openAttr = doc.open ? " open" : "";
          li.innerHTML = `
            <details class="doc-accordion"${openAttr}>
              <summary class="doc-summary">
                <div class="doc-summary-body">
                  <div class="doc-head">
                    ${doc.date ? `<span class="doc-date">${doc.date}</span>` : ""}
                    ${doc.title ? `<span class="doc-title">${doc.title}</span>` : ""}
                  </div>
                  ${doc.description ? `<p class="doc-desc">${doc.description}</p>` : ""}
                  ${tagsHtml}
                </div>
                <span class="accordion-icon" aria-hidden="true"></span>
              </summary>
              ${hasContent ? `<div class="doc-content">${doc.content}</div>` : ""}
            </details>
          `;
        } else {
          // 直接展開表示
          li.innerHTML = `
            <article class="doc-post">
              <div class="doc-head">
                ${doc.date ? `<span class="doc-date">${doc.date}</span>` : ""}
                ${doc.title ? `<h2 class="doc-title">${doc.title}</h2>` : ""}
              </div>
              ${doc.description ? `<p class="doc-desc">${doc.description}</p>` : ""}
              ${hasContent ? `<div class="doc-content">${doc.content}</div>` : ""}
              ${tagsHtml}
            </article>
          `;
        }

        listEl.appendChild(li);
      });
    }

    renderTagBar();
    renderArchiveSidebar();
    renderList();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作成したものを公開するページ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="site-header">
      <h1>作成したものを公開するページ</h1>
      <p class="site-intro">ゴミの音ゲーマーでもできることがある。X:@m4fua</p>
    </header>

    <div id="tag-bar" class="tag-bar"></div>

    <ul id="doc-list" class="doc-list"></ul>
  </main>

  <script src="docs.js"></script>
  <script>
    const listEl = document.getElementById("doc-list");
    const tagBarEl = document.getElementById("tag-bar");
    const items = Array.isArray(DOCUMENTS) ? DOCUMENTS : [];
    let selectedTag = "ALL";

    // 全アイテムから重複なしでタグ一覧を抽出
    const allTags = Array.from(
      new Set(items.flatMap((doc) => (Array.isArray(doc.tags) ? doc.tags : [])))
    );

    function renderTagBar() {
      if (allTags.length === 0) {
        tagBarEl.innerHTML = "";
        return;
      }

      const tagsToShow = ["ALL", ...allTags];
      tagBarEl.innerHTML = tagsToShow
        .map((tag) => {
          const label = tag === "ALL" ? "すべて" : tag;
          const activeClass = selectedTag === tag ? "active" : "";
          return `<button type="button" class="tag-filter-btn ${activeClass}" data-tag="${tag}">${label}</button>`;
        })
        .join("");

      tagBarEl.querySelectorAll(".tag-filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedTag = btn.dataset.tag;
          renderTagBar();
          renderList();
        });
      });
    }

    function renderList() {
      const filtered =
        selectedTag === "ALL"
          ? items
          : items.filter(
              (doc) => Array.isArray(doc.tags) && doc.tags.includes(selectedTag)
            );

      if (filtered.length === 0) {
        listEl.innerHTML =
          '<li class="empty">公開中のコンテンツはまだありません。</li>';
        return;
      }

      listEl.innerHTML = "";
      filtered.forEach((doc) => {
        const li = document.createElement("li");
        li.className = "doc-item";
        const tagsHtml =
          Array.isArray(doc.tags) && doc.tags.length > 0
            ? `<div class="doc-tags">${doc.tags
                .map((t) => `<span class="doc-tag">${t}</span>`)
                .join("")}</div>`
            : "";

        li.innerHTML = `
          <a href="${doc.url}" target="_blank" rel="noopener noreferrer">
            <span class="doc-date">${doc.date || ""}</span>
            <span class="doc-title">${doc.title}</span>
            ${doc.description ? `<p class="doc-desc">${doc.description}</p>` : ""}
            ${tagsHtml}
          </a>
        `;
        listEl.appendChild(li);
      });
    }

    renderTagBar();
    renderList();
  </script>
</body>
</html>
